[package]
name = "empire-high-stakes-desktop"
version = "1.0.0"
description = "EMPIRE: High Stakes Steam Desktop Host"
authors = ["Empire Dev Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
steamworks = { version = "0.11", optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
steam = ["steamworks"]
